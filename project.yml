name: BingeLog
options:
  bundleIdPrefix: se.bingelog
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: BingeLog
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  BingeLog:
    type: application
    platform: iOS
    sources:
      - path: Sources/BingeLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.bingelog.app
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        ENABLE_PREVIEWS: YES
